  #map { position: fixed; inset: 0; }

    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; max-width: 520px; margin: 0 auto;

  #badge { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;

  #who { flex: 1; min-width: 0; }
  #name { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #line { margin: 0; color: var(--muted); font-size: 14px; }
  #follow { flex: none; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line);

  #follow[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  #notice { position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); max-width: 420px; margin: 0 auto;
    padding: 20px; text-align: center; font-size: 17px; }

  [hidden] { display: none !important; }

  .dot.stale { background: var(--stale); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }

    if (res.status === 404) return { missing: true };
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    return Array.isArray(rows) && rows[0] ? rows[0] : { missing: true };
  }

  function ageText(at) {
    const min = Math.max(0, Math.floor((Date.now() - at) / 60_000));
    if (min < 1) return t('now');
    if (min < 60) return t('minutesAgo', { n: min });
    return t('hoursAgo', { n: Math.floor(min / 60) });
  }

  function show() {
    const r = last;
    if (!r || r.missing) {
      top.hidden = true;
      document.title = t('titleNone');
      return say(t('notFound'));
    }
    const name = r.name || 'Cornice';
    document.title = t('title', { name });
    if (r.ended || r.expired) {
      top.hidden = true;
      if (marker) { marker.remove(); marker = null; }
      return say(r.ended ? t('ended', { name }) : t('expired'));
    }
    top.hidden = false;
    el('name').textContent = name;
    el('badge').textContent = [...name.trim()][0]?.toLocaleUpperCase() || '?';
    showLine();
    if (r.lat == null || r.lon == null) {
      follow.hidden = true;
      return say(t('waiting'));
    }
    say('');
    follow.hidden = !map;
    if (!map) return;
    if (!marker) {
      dotEl = document.createElement('div');
      dotEl.className = 'dot';
      marker = new maplibregl.Marker({ element: dotEl }).setLngLat([r.lon, r.lat]).addTo(map);
    } else marker.setLngLat([r.lon, r.lat]);
    showLine();
    if (!centred) {
      centred = true;
      map.jumpTo({ center: [r.lon, r.lat], zoom: 14 });
    } else if (following) map.easeTo({ center: [r.lon, r.lat] });
  }

  /** "skiing · 2 min ago", and the dot faded when old (also between polls). */
  function showLine() {
    const r = last;
    if (!r || r.missing || r.ended || r.expired) return;
    const at = Date.parse(r.updated_at);
    const status = ['skiing', 'lift', 'still', 'paused'].includes(r.status) ? t(r.status) : '';
    el('line').textContent = [status, Number.isFinite(at) ? ageText(at) : ''].filter(Boolean).join(' · ');
    if (dotEl) dotEl.classList.toggle('stale', !Number.isFinite(at) || Date.now() - at > STALE_MS);
  }

  async function tick() {
    clearTimeout(timer);
    try {
      last = await load();
      show();
    } catch (e) {
      // No internet: keep what was shown, say so.
      if (!last) top.hidden = true;
      say(t('offline'));
    }
    // Ended, ran out or unknown: nothing more will come (an unknown one is looked at again now and then).
    if (last && (last.ended || last.expired)) return;
    timer = setTimeout(tick, last && last.missing ? 3 * POLL_MS : POLL_MS);
  }

  if (!token) {
    document.title = t('titleNone');
    say(t('notFound'));
  } else {
    tick();
    // The age line keeps counting between polls; back on the tab, ask at once.
    setInterval(showLine, 15_000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !(last && (last.ended || last.expired))) tick(); });
  }
  window.addEventListener('hashchange', () => location.reload());
})();
</script>
</body>
</html>
